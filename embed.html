<!-- ============================================================
     Austin City Council District 1 — public map embed
     Paste this whole file into a Squarespace Code Block.
     Update DATA_BASE below to point at your public GitHub repo
     (served via jsDelivr) once it exists.
     ============================================================ -->
<div id="d1-wrap" style="width:100%">
  <form id="d1-search" style="display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px">
    <input id="d1-q" type="text" placeholder="Enter an Austin address to see if it's in District 1" autocomplete="street-address"
           style="flex:1 1 260px;min-width:0;padding:10px 12px;border:1px solid #cbd5e1;border-radius:6px;font-size:15px" />
    <button type="submit" style="padding:10px 16px;border:0;border-radius:6px;background:#c8102e;color:#fff;font-size:15px;cursor:pointer">Search</button>
    <button type="button" id="d1-locate" style="padding:10px 14px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;font-size:15px;cursor:pointer">&#9673; Use my location</button>
  </form>
  <div id="d1-result" style="min-height:22px;margin:0 0 8px;font-size:15px"></div>
  <div id="d1-map" style="height:520px;width:100%;border-radius:8px;overflow:hidden;background:#eef2f6"></div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<style>
  #d1-map .leaflet-container { font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #d1-map .precinct-tip { background:#fff; border:1px solid #cbd5e1; border-radius:4px; padding:4px 8px; box-shadow:0 1px 4px rgba(0,0,0,.15); }
  #d1-map .precinct-tip::before { display:none; }
  #d1-map .d1-legend { background:#fff; padding:8px 10px; border-radius:6px; box-shadow:0 1px 4px rgba(0,0,0,.2); line-height:1.6; }
  #d1-map .d1-legend .sw { display:inline-block; width:22px; height:12px; vertical-align:middle; margin-right:6px; border-radius:2px; }
</style>

<script>
(function init() {
  // Wait for Leaflet if the host loaded the script tag asynchronously.
  if (typeof L === "undefined") { setTimeout(init, 50); return; }

  // ---- CONFIG -------------------------------------------------
  // Local testing: leave as "" and serve this folder (see README).
  // Production:    "https://cdn.jsdelivr.net/gh/hamzsait/district1-map@main"
  var DATA_BASE = "https://cdn.jsdelivr.net/gh/hamzsait/district1-map@main";
  var DISTRICT_COLOR = "#c8102e";   // outline
  var PRECINCT_COLOR = "#1d4ed8";   // precinct borders
  // ------------------------------------------------------------

  function base(p) { return (DATA_BASE ? DATA_BASE.replace(/\/$/, "") + "/" : "") + p; }

  var map = L.map("d1-map", { scrollWheelZoom: false, zoomControl: true, zoomSnap: 0.25 })
    .setView([30.33, -97.63], 11);

  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &middot; Boundaries: Texas Legislative Council, City of Austin'
  }).addTo(map);

  var precinctLayer, outlineLayer;

  Promise.all([
    fetch(base("d1-precincts.geojson")).then(function (r) { return r.json(); }),
    fetch(base("d1-outline.geojson")).then(function (r) { return r.json(); })
  ]).then(function (res) {
    var precincts = res[0], outline = res[1];

    precinctLayer = L.geoJSON(precincts, {
      style: { color: PRECINCT_COLOR, weight: 1, opacity: 0.7, fillColor: PRECINCT_COLOR, fillOpacity: 0.08 },
      onEachFeature: function (f, layer) {
        layer.bindTooltip("Precinct " + f.properties.p, { sticky: true, className: "precinct-tip", direction: "top" });
        layer.on({
          mouseover: function (e) { e.target.setStyle({ fillOpacity: 0.3, weight: 2 }); },
          mouseout: function (e) { precinctLayer.resetStyle(e.target); }
        });
      }
    }).addTo(map);

    outlineLayer = L.geoJSON(outline, {
      style: { color: DISTRICT_COLOR, weight: 3, fill: false },
      interactive: false
    }).addTo(map);

    function fit() { map.invalidateSize(); map.fitBounds(outlineLayer.getBounds(), { padding: [12, 12] }); }
    fit();
    setTimeout(fit, 300);
    window.addEventListener("load", fit);

    var legend = L.control({ position: "bottomleft" });
    legend.onAdd = function () {
      var d = L.DomUtil.create("div", "d1-legend");
      d.innerHTML =
        '<div><span class="sw" style="border:2px solid ' + DISTRICT_COLOR + '"></span>District 1 boundary</div>' +
        '<div><span class="sw" style="border:1px solid ' + PRECINCT_COLOR + ';background:rgba(29,78,216,.12)"></span>Voting precinct</div>';
      return d;
    };
    legend.addTo(map);
    enableLookup(precincts, outline);
  }).catch(function (err) {
    document.getElementById("d1-map").innerHTML =
      '<p style="padding:1em;color:#b91c1c">Map data failed to load.</p>';
    console.error("D1 map:", err);
  });

  // Squarespace sometimes lays the block out after Leaflet measures it.
  setTimeout(function () { map.invalidateSize(); }, 300);

  // ---- Address search + geolocation --------------------------
  var form = document.getElementById("d1-search"),
      input = document.getElementById("d1-q"),
      locateBtn = document.getElementById("d1-locate"),
      resultEl = document.getElementById("d1-result"),
      marker = null;

  // Ray-casting point-in-polygon for GeoJSON Polygon / MultiPolygon ([lng, lat]).
  function inRing(pt, ring) {
    var x = pt[0], y = pt[1], inside = false;
    for (var i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      var xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  }
  function inPolygon(pt, polyCoords) {           // outer ring + holes
    if (!inRing(pt, polyCoords[0])) return false;
    for (var h = 1; h < polyCoords.length; h++) if (inRing(pt, polyCoords[h])) return false;
    return true;
  }
  function inFeature(pt, f) {
    var g = f.geometry;
    if (g.type === "Polygon") return inPolygon(pt, g.coordinates);
    if (g.type === "MultiPolygon") return g.coordinates.some(function (p) { return inPolygon(pt, p); });
    return false;
  }

  function setResult(html, isErr) {
    resultEl.innerHTML = html;
    resultEl.style.color = isErr ? "#b91c1c" : "#111";
  }

  function enableLookup(precincts, outline) {
    function showPoint(lat, lng, label) {
      var pt = [lng, lat];
      var inD1 = inFeature(pt, outline.features[0]);
      var pct = null;
      for (var i = 0; i < precincts.features.length; i++) {
        if (inFeature(pt, precincts.features[i])) { pct = precincts.features[i].properties.p; break; }
      }
      if (marker) map.removeLayer(marker);
      marker = L.marker([lat, lng]).addTo(map);
      var msg = inD1
        ? '<strong style="color:#15803d">&#10003; In District 1</strong>' + (pct != null ? " &middot; Precinct " + pct : "")
        : '<strong>Not in District 1</strong>';
      if (label) msg += '<div style="font-size:13px;color:#555">' + label + "</div>";
      marker.bindPopup(msg).openPopup();
      setResult(msg);
      map.flyTo([lat, lng], Math.max(map.getZoom(), 13.5));
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var q = input.value.trim();
      if (!q) return;
      setResult("Searching&hellip;");
      // Nominatim (OpenStreetMap) geocoder, biased to the Austin area.
      var url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us" +
                "&viewbox=-98.2,30.75,-97.2,29.95&bounded=1&q=" + encodeURIComponent(q);
      fetch(url, { headers: { "Accept-Language": "en" } })
        .then(function (r) { return r.json(); })
        .then(function (hits) {
          if (!hits.length) { setResult("Couldn't find that address. Try adding the city or ZIP code.", true); return; }
          showPoint(parseFloat(hits[0].lat), parseFloat(hits[0].lon), hits[0].display_name);
        })
        .catch(function () { setResult("Address lookup failed. Please try again.", true); });
    });

    locateBtn.addEventListener("click", function () {
      if (!navigator.geolocation) { setResult("Your browser doesn't support location.", true); return; }
      setResult("Getting your location&hellip;");
      navigator.geolocation.getCurrentPosition(
        function (pos) { showPoint(pos.coords.latitude, pos.coords.longitude, "Your current location"); },
        function (err) {
          setResult(err.code === 1 ? "Location access was denied. You can type an address instead." : "Couldn't get your location.", true);
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    });
  }
})();
</script>
